name: Bouw Windows-exe

on:
  push:
    branches: [laag-0, main]
  workflow_dispatch:

jobs:
  bouw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Afhankelijkheden installeren
        run: pip install -e ".[dev]"

      - name: Tests draaien
        run: python -m pytest -q -p no:cacheprovider

      - name: libmpv ophalen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p libs mpvdl
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-*.7z" --dir mpvdl
          7z x mpvdl/*.7z -ompvdl/uit -y
          find mpvdl/uit -iname "libmpv*.dll" -o -iname "mpv-2.dll" | head
          cp "$(find mpvdl/uit -iname 'libmpv-2.dll' | head -n 1)" libs/libmpv-2.dll

      - name: Exe bouwen
        run: pyinstaller mediaspeler.spec --noconfirm

      - name: Selftest van de exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\mediaspeler\mediaspeler.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selftest faalde met exitcode $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: mediaspeler-windows
          path: dist/mediaspeler
