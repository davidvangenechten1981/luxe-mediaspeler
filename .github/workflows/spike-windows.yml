name: Spike - video en interface op Windows

on:
  push:
    branches: [ultimate]
  workflow_dispatch:

env:
  VLC_VERSION: "3.0.21"

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: VLC ophalen en controleren
        shell: pwsh
        run: |
          $url = "https://download.videolan.org/pub/videolan/vlc/$env:VLC_VERSION/win64/vlc-$env:VLC_VERSION-win64.7z"
          Invoke-WebRequest $url -OutFile vlc.7z
          $size = (Get-Item vlc.7z).Length
          $magic = [System.BitConverter]::ToString([System.IO.File]::ReadAllBytes("vlc.7z")[0..5])
          "bestand: $size bytes, eerste bytes: $magic"
          "sha256 vlc.7z: " + (Get-FileHash vlc.7z -Algorithm SHA256).Hash
          if ($magic -ne "37-7A-BC-AF-27-1C") { throw "Geen geldig 7z-archief (waarschijnlijk een HTML-pagina): $url" }
          7z x vlc.7z -ovlc-extract -y | Out-Null
          New-Item -ItemType Directory -Force vlc | Out-Null
          $root = Get-ChildItem vlc-extract -Directory | Select-Object -First 1
          Copy-Item "$($root.FullName)\libvlc.dll", "$($root.FullName)\libvlccore.dll" vlc\
          Copy-Item "$($root.FullName)\plugins" vlc\plugins -Recurse
          Get-ChildItem vlc | Select-Object Name

      - name: Afhankelijkheden
        run: pnpm install --frozen-lockfile

      - name: App bouwen (zonder installer)
        run: pnpm tauri build --no-bundle

      - name: Test D1 - video in het hoofdvenster
        shell: pwsh
        run: |
          ./scripts/ci/screenshot-check.ps1 -Exe "$PWD\src-tauri\target\release\vlc-ultimate.exe" -Mode d1 -Media "$PWD\assets\test\red.mp4" -VlcDir "$PWD\vlc"

      - name: Test D2 - eigen videovenster onder transparante interface
        shell: pwsh
        run: |
          ./scripts/ci/screenshot-check.ps1 -Exe "$PWD\src-tauri\target\release\vlc-ultimate.exe" -Mode d2 -Media "$PWD\assets\test\red.mp4" -VlcDir "$PWD\vlc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-schermafbeeldingen
          path: shots
