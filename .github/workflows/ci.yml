name: CI

on:
  push:
    branches: [studio, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (typecheck, tests, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

  rust-linux:
    name: Rust op Linux (format, clippy, tests met echte ffmpeg en libvlc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg vlc libvlc-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          VLC_VERBOSE: "0"

  audit:
    name: Bekende kwetsbaarheden (informatief)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm audit --prod
        continue-on-error: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        continue-on-error: true

  windows:
    name: Windows (tests, installer, schermtest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tools downloaden en controleren (FFmpeg GPL-build en VLC 3.0.21)
        shell: pwsh
        run: ./scripts/ci/fetch-tools.ps1

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Rust-tests (echte ffmpeg en libvlc)
        shell: pwsh
        run: |
          $env:VU_FFMPEG = (Resolve-Path resources/ffmpeg/ffmpeg.exe).Path
          $env:VU_FFPROBE = (Resolve-Path resources/ffmpeg/ffprobe.exe).Path
          $env:VU_VLC_DIR = (Resolve-Path resources/vlc).Path
          $env:VLC_PLUGIN_PATH = (Resolve-Path resources/vlc/plugins).Path
          # ffmpeg ook op PATH, anders slaan de tests in vu-core de echte-conversietests over
          $env:PATH = (Resolve-Path resources/ffmpeg).Path + ";" + $env:PATH
          cargo test --workspace

      - name: Installer bouwen (NSIS)
        run: pnpm tauri build --bundles nsis

      - name: Draagbare versie maken (zip, zonder installatie)
        shell: pwsh
        run: |
          $d = "portable/VLC Ultimate"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/vlc-ultimate.exe $d
          Copy-Item resources/ffmpeg, resources/vlc $d -Recurse
          "Dit bestand maakt de app draagbaar: bibliotheek, instellingen en logboeken komen in de map 'data' naast het programma." | Set-Content "$d/portable.txt"
          Compress-Archive -Path "$d/*" -DestinationPath "portable/VLC-Ultimate-draagbaar.zip"
          "Draagbare versie: $([math]::Round((Get-Item portable/VLC-Ultimate-draagbaar.zip).Length/1MB)) MB"

      - name: Installeren, starten, schermtest, verwijderen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Recurse target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB)) MB)"
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = @("$env:LOCALAPPDATA\VLC Ultimate", "$env:ProgramFiles\VLC Ultimate") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "Installatiemap niet gevonden" }
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          $media = (Resolve-Path assets/test/red.mp4).Path
          $out = & scripts/ci/screenshot-check.ps1 -Exe $exe.FullName -Media $media -Name geinstalleerd -OutDir shots
          $out | Write-Host
          $uninst = Get-ChildItem $dir -Filter "uninstall*.exe" | Select-Object -First 1
          Start-Process $uninst.FullName -ArgumentList "/S" -Wait
          Start-Sleep 3
          if (Get-ChildItem $dir -Filter *.exe -ErrorAction SilentlyContinue) { Write-Warning "Na verwijderen staan er nog bestanden in $dir" }
          $result = $out | Where-Object { $_ -like "RESULT*" }
          if ($result -notmatch "interface_zichtbaar=True") { throw "Interface niet zichtbaar: $result" }
          if ($result -notmatch "video_zichtbaar_pct=([1-9]\d*)") { throw "Video niet zichtbaar: $result" }

      - name: Levenscyclus (venster onthouden, verwijderen, register)
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Recurse target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          ./scripts/ci/lifecycle-check.ps1 -Setup $setup.FullName

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-resultaten
          retention-days: 30
          path: |
            shots/
            checksums.txt
            target/release/bundle/nsis/*.exe
            portable/VLC-Ultimate-draagbaar.zip
