name: CI

on:
  push:
    branches: [studio, main]
  pull_request:
  workflow_dispatch:

env:
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
  VLC_URL: https://download.videolan.org/pub/videolan/vlc/3.0.21/win64/vlc-3.0.21-win64.7z

jobs:
  frontend:
    name: Frontend (typecheck, tests, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

  rust-linux:
    name: Rust op Linux (format, clippy, tests met echte ffmpeg en libvlc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg vlc libvlc-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          VLC_VERBOSE: "0"

  windows:
    name: Windows (tests, installer, schermtest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tools downloaden (FFmpeg GPL-build en VLC 3.0.21)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dl, resources/ffmpeg, resources/vlc | Out-Null
          Invoke-WebRequest $env:FFMPEG_URL -OutFile dl/ffmpeg.zip
          Invoke-WebRequest $env:VLC_URL -OutFile dl/vlc.7z
          foreach ($f in "dl/ffmpeg.zip", "dl/vlc.7z") {
            $b = [IO.File]::ReadAllBytes((Resolve-Path $f))[0..1]
            if ($f.EndsWith("zip") -and -not ($b[0] -eq 0x50 -and $b[1] -eq 0x4B)) { throw "$f is geen zip" }
            if ($f.EndsWith("7z") -and -not ($b[0] -eq 0x37 -and $b[1] -eq 0x7A)) { throw "$f is geen 7z" }
          }
          Expand-Archive dl/ffmpeg.zip dl/ffmpeg
          $bin = Get-ChildItem dl/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName resources/ffmpeg/
          Copy-Item (Join-Path $bin.DirectoryName ffprobe.exe) resources/ffmpeg/
          7z x dl/vlc.7z -odl/vlc -y | Out-Null
          $v = Get-ChildItem dl/vlc -Directory | Select-Object -First 1
          Copy-Item (Join-Path $v.FullName libvlc.dll) resources/vlc/
          Copy-Item (Join-Path $v.FullName libvlccore.dll) resources/vlc/
          Copy-Item (Join-Path $v.FullName plugins) resources/vlc/plugins -Recurse
          "SHA-256 van gebruikte downloads:" | Tee-Object checksums.txt
          Get-FileHash dl/ffmpeg.zip, dl/vlc.7z -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Tee-Object checksums.txt -Append
          & resources/ffmpeg/ffmpeg.exe -version | Select-Object -First 1

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Rust-tests (echte ffmpeg en libvlc)
        shell: pwsh
        run: |
          $env:VU_FFMPEG = (Resolve-Path resources/ffmpeg/ffmpeg.exe).Path
          $env:VU_FFPROBE = (Resolve-Path resources/ffmpeg/ffprobe.exe).Path
          $env:VU_VLC_DIR = (Resolve-Path resources/vlc).Path
          $env:VLC_PLUGIN_PATH = (Resolve-Path resources/vlc/plugins).Path
          # ffmpeg ook op PATH, anders slaan de tests in vu-core de echte-conversietests over
          $env:PATH = (Resolve-Path resources/ffmpeg).Path + ";" + $env:PATH
          cargo test --workspace

      - name: Installer bouwen (NSIS)
        run: pnpm tauri build --bundles nsis

      - name: Installeren, starten, schermtest, verwijderen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Recurse target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB)) MB)"
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dir = @("$env:LOCALAPPDATA\VLC Ultimate", "$env:ProgramFiles\VLC Ultimate") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { throw "Installatiemap niet gevonden" }
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          $media = (Resolve-Path assets/test/red.mp4).Path
          $out = & scripts/ci/screenshot-check.ps1 -Exe $exe.FullName -Media $media -Name geinstalleerd -OutDir shots
          $out | Write-Host
          $uninst = Get-ChildItem $dir -Filter "uninstall*.exe" | Select-Object -First 1
          Start-Process $uninst.FullName -ArgumentList "/S" -Wait
          Start-Sleep 3
          if (Get-ChildItem $dir -Filter *.exe -ErrorAction SilentlyContinue) { Write-Warning "Na verwijderen staan er nog bestanden in $dir" }
          $result = $out | Where-Object { $_ -like "RESULT*" }
          if ($result -notmatch "interface_zichtbaar=True") { throw "Interface niet zichtbaar: $result" }
          if ($result -notmatch "video_zichtbaar_pct=([1-9]\d*)") { throw "Video niet zichtbaar: $result" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-resultaten
          path: |
            shots/
            checksums.txt
            target/release/bundle/nsis/*.exe
