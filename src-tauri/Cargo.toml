[package]
name = "vlc-ultimate"
version = "0.1.0"
description = "VLC Ultimate - Ultimate Studio Edition"
edition = "2021"
rust-version = "1.85"

[features]
default = ["core"]
# De kern (SQLite, FFmpeg-conversie) kan uit voor een snelle Windows-typecontrole op Linux.
core = ["dep:vu-core"]

[lib]
name = "vlc_ultimate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
vu-core = { path = "../crates/vu-core", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
