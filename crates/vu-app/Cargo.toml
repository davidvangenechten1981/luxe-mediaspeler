[package]
name = "vu-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Applicatielaag van VLC Ultimate: diensten en staat, zonder UI-framework"

[dependencies]
vu-core = { path = "../vu-core" }
vu-vlc = { path = "../vu-vlc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
