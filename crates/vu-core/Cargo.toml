[package]
name = "vu-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Kernlogica van VLC Ultimate: database, scanner, mediainfo, converter (zonder UI)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
url = "2"
fs4 = "1"
lofty = "0.24.0"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"
